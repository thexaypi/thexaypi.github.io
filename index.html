/* =========================================================
   AITTE — "the feature"
   The site is framed as a film: true-black letterbox bars hold
   the interface, scroll is the playhead, sections are scenes.
   ========================================================= */
:root{
  --night:#05070C;
  --ink:#ECEFF4;
  --ink-2:rgba(236,239,244,.68);
  --ink-3:rgba(236,239,244,.56);
  --hair:rgba(236,239,244,.11);
  --hair-2:rgba(236,239,244,.2);
  --sodium:#FFB547;
  --ice:#8CCBFF;
  --signal:#7DFF9A;
  --ink-inv:#05070B;
  --sans:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:clamp(20px,4.6vw,72px);
  --bt:78px;--bb:64px;--bta:78px;--bba:44px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* ---------- themes: Scene (default — amber/ice noir), Dark (cool obsidian + violet/mint), Film (plum dusk + gold/rose), Winter (midnight frost — full block at the end of this stylesheet) ---------- */
html[data-theme="dark"]{
  --night:#000000;--ink:#F2F3F7;--ink-2:rgba(242,243,247,.64);--ink-3:rgba(242,243,247,.46);
  --hair:rgba(242,243,247,.09);--hair-2:rgba(242,243,247,.17);
  --sodium:#9B8CFF;--ice:#54D6FF;--signal:#54FFC9;color-scheme:dark;
}
html[data-theme="vibe"]{
  --night:#1A1222;--ink:#F5E9DD;--ink-2:rgba(245,233,221,.72);--ink-3:rgba(245,233,221,.54);
  --hair:rgba(245,233,221,.14);--hair-2:rgba(245,233,221,.24);
  --sodium:#E8A23D;--ice:#DD93AC;--signal:#93B373;color-scheme:dark;--ink-inv:#1A1222;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--bt) + 12px);scroll-padding-bottom:var(--bb);transition:background .01s}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
img,svg,canvas{display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}
::selection{background:var(--sodium);color:#000}
.skip-link{position:fixed;left:16px;top:-90px;z-index:120;background:var(--ink);color:var(--ink-inv);padding:10px 14px;font-size:14px;font-weight:500}
.skip-link:focus{top:calc(16px + var(--sat))}
html.menu-open{overflow:hidden}

/* ---------- film texture ---------- */
.vignette{position:fixed;inset:0;z-index:44;pointer-events:none;background:radial-gradient(140% 110% at 50% 50%,transparent 62%,var(--vig-edge,rgba(0,0,0,.28)) 100%)}
.grain{position:fixed;inset:0;z-index:45;pointer-events:none;background-image:var(--grain,none);background-size:180px 180px;opacity:.14}
@keyframes grain{0%{transform:translate(0,0)}12%{transform:translate(-3%,2%)}25%{transform:translate(2%,-4%)}37%{transform:translate(-4%,-1%)}50%{transform:translate(3%,3%)}62%{transform:translate(-2%,4%)}75%{transform:translate(4%,-2%)}87%{transform:translate(-1%,-3%)}100%{transform:translate(0,0)}}

/* ---------- letterbox bars = the interface ---------- */
.bar{position:fixed;left:0;right:0;z-index:50;background:var(--night)}
.bar-top{top:0;height:calc(var(--bt) + var(--sat))}
.bar-top::after,.bar-bot::before{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(236,239,244,.07)}
.bar-top::after{bottom:0}
.bar-bot{bottom:0;height:calc(var(--bb) + var(--sab))}
.bar-bot::before{top:0}
.nav{height:60px;margin-top:var(--sat);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 var(--gutter)}
.brand{font-weight:600;font-size:14px;letter-spacing:.44em;padding:12px 0}
.nav-links{display:flex;gap:clamp(20px,2.8vw,44px);margin:0 auto}
.nav-links a{font-size:14px;color:var(--ink-2);padding:10px 0;transition:color .25s}
.nav-links a:hover,.nav-links a[aria-current="true"]{color:var(--ink)}
.burger{display:none;position:relative;width:44px;height:44px;margin-right:-10px;background:none;border:0;cursor:pointer}
.burger span{position:absolute;left:11px;right:11px;height:1.5px;background:var(--ink);transition:transform .45s var(--ease),top .45s var(--ease)}
.burger span:first-child{top:18px}
.burger span:last-child{top:25px}
.menu-open .burger span:first-child{top:21.5px;transform:rotate(45deg)}
.menu-open .burger span:last-child{top:21.5px;transform:rotate(-45deg)}
.mob{position:fixed;top:0;right:0;bottom:0;left:0;z-index:49;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s linear .45s}
.menu-open .mob{opacity:1;visibility:visible;transition:opacity .45s var(--ease),visibility 0s}
.mob a{display:flex;align-items:baseline;gap:14px;padding:8px 20px;font-size:clamp(30px,9vw,44px);font-weight:300;letter-spacing:-.035em}
.mob small{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--sodium)}

.transport{position:absolute;left:0;right:0;bottom:var(--sab);height:44px;display:flex;align-items:center;gap:18px;padding:0 var(--gutter);font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.play{flex:none;width:9px;height:10px;display:inline-flex;justify-content:space-between}
.play::before,.play::after{content:"";width:3px;height:10px;background:var(--ink-3)}
.transport.rolling .play::before{width:0;height:0;border-style:solid;border-width:5px 0 5px 9px;border-color:transparent transparent transparent var(--sodium);background:none}
.transport.rolling .play::after{display:none}
.tc{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sc-num{color:var(--sodium);white-space:nowrap}
.sc-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30ch;min-width:0}
.timeline{flex:1;position:relative;display:flex;align-items:center;gap:3px;height:20px;min-width:140px}
.timeline button{position:relative;height:6px;flex:1 1 0;min-width:4px;border:0;padding:0;background:rgba(236,239,244,.13);cursor:pointer;transition:background .25s}
.timeline button::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.timeline button:hover,.timeline button.cur{background:rgba(236,239,244,.32)}
.timeline .tip{position:absolute;left:50%;bottom:18px;transform:translate(-50%,4px);white-space:nowrap;background:#000;border:1px solid var(--hair-2);padding:5px 9px;color:var(--ink);font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.timeline button:hover .tip,.timeline button:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.timeline .tip b{margin-right:8px;font-weight:500;color:var(--sodium)}
.ph{position:absolute;top:2px;bottom:2px;left:0;width:2px;background:var(--sodium);box-shadow:0 0 8px rgba(255,181,71,.7);pointer-events:none;will-change:transform}
.bar-cta{flex:none;display:inline-flex;align-items:center;gap:10px;margin-left:auto;font-family:var(--sans);font-size:13px;color:var(--ink-2);padding:10px 0;opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s linear .4s}
.bar-cta.show{opacity:1;visibility:visible;transition:opacity .4s}
.bar-cta b{font-weight:500;color:var(--ink);border-bottom:1px solid var(--sodium);padding-bottom:1px}
.timeline + .bar-cta{margin-left:0}
.skip{display:none;margin-left:auto;flex:none;background:none;border:1px solid var(--hair-2);color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:7px 14px;cursor:pointer}
html.intro .skip{display:inline-block}
html.intro .bar-cta{display:none}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:50px;padding:0 24px;font-size:15px;font-weight:500;letter-spacing:-.005em;line-height:1;color:var(--ink);background:transparent;border:1px solid var(--hair-2);cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease)}
.btn:hover{border-color:rgba(236,239,244,.55)}
.btn-primary{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.btn-primary:hover{background:#fff;border-color:#fff}
.btn svg{width:11px;height:12px;flex:none}
.nav-cta{min-height:38px;padding:0 16px;font-size:13.5px}
.magnetic{transition:transform .5s var(--ease),background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease)}

/* ---------- autofocus box (fine pointers only) ---------- */
.af{position:fixed;left:0;top:0;width:28px;height:28px;z-index:95;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.af.lock{opacity:1}
.af i{position:absolute;width:9px;height:9px;border:0 solid var(--sodium)}
.af i:nth-child(1){left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}
.af i:nth-child(2){right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.af i:nth-child(3){left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}
.af i:nth-child(4){right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}

/* ---------- cold open ---------- */
.curtain{display:none;position:fixed;inset:0;z-index:65;background:#000;pointer-events:none}
html.intro .curtain{display:block;animation:curtainFail .4s ease 6s forwards}
@keyframes curtainFail{to{opacity:0;visibility:hidden}}
.credit{position:fixed;left:0;right:0;top:50%;z-index:66;transform:translateY(-50%);text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:var(--ink-2);opacity:0;pointer-events:none;transition:opacity .9s var(--ease)}
.credit.on{opacity:1}
.flare{position:fixed;left:0;right:0;top:50%;z-index:66;height:2px;margin-top:-1px;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent 0%,rgba(140,203,255,0) 6%,rgba(170,220,255,.95) 50%,rgba(140,203,255,0) 94%,transparent 100%);box-shadow:0 0 22px 3px rgba(110,180,255,.35)}
.flare.go{animation:flare 1.2s var(--ease) forwards}
@keyframes flare{0%{opacity:0;transform:scaleX(.08)}22%{opacity:1}100%{opacity:0;transform:scaleX(1.3)}}

/* ---------- hero: the establishing shot ---------- */
.hero{position:relative;height:210vh;background:#000}
.hero-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#020306}
#scene{position:absolute;inset:0;width:100%;height:100%}
.hero-fallback{position:absolute;inset:0;opacity:0;transition:opacity 1.2s var(--ease);background:radial-gradient(60% 45% at 68% 78%,rgba(255,181,71,.13),transparent 70%),linear-gradient(180deg,#03050a 0%,#070b12 58%,#0d0b0b 64%,#020306 100%)}
.hero-fallback svg{position:absolute;inset:0;width:100%;height:100%}
html.no-webgl .hero-fallback{opacity:1}
html.no-webgl #scene{display:none}
.hero-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--scrim-1,rgba(2,3,6,.82)) 0%,var(--scrim-2,rgba(2,3,6,.55)) 30%,var(--scrim-3,rgba(2,3,6,0)) 60%)}
.hero-fade{position:absolute;inset:0;background:#000;opacity:var(--hf,0);pointer-events:none;z-index:4}
.hero-edge{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:4;pointer-events:none;opacity:0;background:linear-gradient(rgba(0,0,0,0),#000 90%)}
.locsuper{position:absolute;left:50%;top:50%;z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 46px;text-align:center;pointer-events:none;opacity:0;transform:translate3d(-50%,-50%,0)}
.locsuper::before{content:"";position:absolute;inset:-60px -110px;z-index:-1;background:radial-gradient(closest-side,rgba(2,3,6,.78),rgba(2,3,6,.4) 55%,rgba(2,3,6,0))}
.locsuper::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--lr,0);--c:rgba(236,239,244,.4);background:linear-gradient(var(--c),var(--c)) 0 0/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1px 12px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1px 12px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1px 12px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/12px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1px 12px no-repeat}
.ls-kick{font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--ink-3)}
.ls-mid{display:flex;align-items:center;gap:24px}
.ls-rule{width:clamp(36px,7vw,110px);height:1px;background:linear-gradient(90deg,rgba(236,239,244,0),rgba(236,239,244,.6));transform:scaleX(var(--lr,0));transform-origin:right center}
.ls-rule:last-child{background:linear-gradient(90deg,rgba(236,239,244,.6),rgba(236,239,244,0));transform-origin:left center}
.ls-word{font-size:clamp(26px,3.2vw,50px);font-weight:300;line-height:1;text-transform:uppercase;letter-spacing:var(--ls,.62em);margin-right:calc(var(--ls,.62em) * -1);
  background:linear-gradient(90deg,#ECEFF4 0 42%,#ffdcaa 50%,#ECEFF4 58% 100%);background-size:320% 100%;background-position:var(--sx,100%) 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  clip-path:inset(-30% calc((1 - var(--rv,1)) * 50%) -30% calc((1 - var(--rv,1)) * 50%))}
.ls-row{display:flex;gap:18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-2)}
.ls-row span:empty{display:none}
.ls-row span + span{padding-left:18px;border-left:1px solid var(--hair-2)}
@media (max-width:759px){.locsuper{padding:22px 18px;gap:12px}.ls-rule{display:none}.ls-word{font-size:clamp(24px,7.4vw,34px);letter-spacing:calc(var(--ls,.62em) * .62);margin-right:calc(var(--ls,.62em) * -.62)}.ls-kick,.ls-row{font-size:10px}}
.hero-copy{position:absolute;left:0;right:0;top:0;bottom:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:var(--bta) var(--gutter) var(--bba);opacity:var(--hc,1)}
.hero-inner{width:100%;max-width:1320px;margin:0 auto}
.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 clamp(14px,2.6vh,28px);font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px rgba(125,255,154,.8)}
.eyebrow .ln{width:28px;height:1px;background:var(--hair-2)}
.title{margin:0;max-width:9.6em;font-size:clamp(42px,min(6.3vw,10.4vh),116px);font-weight:500;line-height:.95;letter-spacing:-.045em;text-shadow:-.5px 0 rgba(255,80,80,.3),.5px 0 rgba(80,190,255,.3)}

.hud{position:absolute;right:var(--gutter);bottom:calc(var(--bba) + clamp(18px,3.2vh,34px));display:grid;grid-template-columns:minmax(0,214px);border:1px solid var(--hair);background:var(--panel-bg,rgba(2,3,6,.58))}

.hud-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-2)}
.hud-s{color:var(--signal)}
.hud-v{margin:8px 0 3px;font-size:30px;font-weight:300;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.hud-v small{margin-left:4px;font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--ink-2)}
.hud-c{font-size:11.5px;line-height:1.35;color:var(--ink-2)}
.hud-viz{display:flex;align-items:flex-end;gap:3px;height:14px;margin-top:10px}
.hud-spark span{flex:1;height:var(--h);background:var(--ice);opacity:.75;transform-origin:bottom;animation:eq 2.4s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes eq{to{transform:scaleY(.55)}}
.hud-layers{align-items:center}
.hud-layers span{flex:1;height:4px;background:var(--ice)}
.hud-dots{align-items:center;gap:6px}
.hud-dots span{width:6px;height:6px;border-radius:50%;background:var(--ice)}
.hud-dots span.off{background:rgba(140,203,255,.22)}
.hud-dots b{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--ink-2)}

.track{position:absolute;left:0;top:0;z-index:2;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .9s var(--ease),visibility 0s linear .9s}
.track.on{opacity:1;visibility:visible;transition:opacity .9s var(--ease),visibility 0s}
.track .ret{position:absolute;left:-16px;top:-16px;width:32px;height:32px}
.track .ret::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--ice),var(--ice)) 0 0/9px 1px no-repeat,linear-gradient(var(--ice),var(--ice)) 0 0/1px 9px no-repeat,linear-gradient(var(--ice),var(--ice)) 100% 0/9px 1px no-repeat,linear-gradient(var(--ice),var(--ice)) 100% 0/1px 9px no-repeat,linear-gradient(var(--ice),var(--ice)) 0 100%/9px 1px no-repeat,linear-gradient(var(--ice),var(--ice)) 0 100%/1px 9px no-repeat,linear-gradient(var(--ice),var(--ice)) 100% 100%/9px 1px no-repeat,linear-gradient(var(--ice),var(--ice)) 100% 100%/1px 9px no-repeat}
.track .ret::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;background:var(--ice);border-radius:50%}
.track .lbl{position:absolute;left:30px;top:-24px;display:grid;padding-left:12px;border-left:1px solid rgba(140,203,255,.55);font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink-2);white-space:nowrap}
.track .lbl b{font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.track.flip .lbl{left:auto;right:30px;text-align:right;padding:0 12px 0 0;border-left:0;border-right:1px solid rgba(140,203,255,.55)}
html.no-webgl .track{opacity:1;visibility:visible;transform:none!important;left:auto;right:calc(var(--gutter) + 40px);top:calc(var(--bta) + 56px)}

/* ---------- reel: film strips + trailer cards ---------- */
.reel{position:relative;background:transparent}
.reel::before{content:"";position:absolute;left:0;right:0;top:0;height:28vh;pointer-events:none;background:linear-gradient(#000 0%,rgba(0,0,0,.6) 40%,transparent)}

.trailer{position:relative;height:calc(100vh + 7 * 11vh)}
.trailer-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:transparent;perspective:1400px}
.trailer-tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.tilt-far{position:absolute;inset:0;transform:translateZ(-200px) scale(1.14);transition:filter .3s}
.tilt-near{position:absolute;inset:0;transform:translateZ(80px) scale(.94);overflow:hidden}
.trailer.tilt-live .tilt-far{filter:blur(var(--tfb,0px))}
.trailer-glow{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(560px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),rgba(255,255,255,.02) 38%,transparent 62%);mix-blend-mode:screen}
.trailer.tilt-live .trailer-glow{opacity:1}
.city-far{position:absolute;left:0;bottom:calc(var(--bb) + 32%);width:320vw;height:22%;opacity:.7;pointer-events:none;will-change:transform}
.city-far svg{display:block;width:100%;height:100%}
.tcards{list-style:none;margin:0;padding:0;position:absolute;top:0;left:0;height:100%;display:flex;width:800vw;will-change:transform}
.tcard{position:relative;flex:none;width:100vw;height:100%}
.tcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(34% 34% at 50% 70%,var(--cg),transparent 72%)}
.tc-copy{position:absolute;left:var(--gutter);right:auto;top:calc(var(--bt) + 3vh);bottom:auto;z-index:1;max-width:min(400px,40vw);max-height:32vh;overflow:hidden;text-align:left;padding-left:18px;border-left:2px solid var(--c)}
.tc-k{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--c)}
.tc-t{display:block;margin:8px 0 11px;font-size:clamp(15px,1.5vw,20px);font-weight:300;line-height:1.1;letter-spacing:-.015em;clip-path:inset(-20% calc((1 - var(--rv,1)) * 100%) -20% 0)}
.tc-l{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.tc-l i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.tc-geo{display:block;margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--c);opacity:.8;clip-path:inset(-20% calc((1 - var(--rv,1)) * 100%) -20% 0)}
.tc-art{position:absolute;left:0;top:calc(var(--bt) + 17vh);bottom:calc(var(--bb) + 1vh);width:100%;height:auto;opacity:.95}
.tc-art use{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round}
.tc-art .line{stroke-width:2}
.tc-art .glow{stroke-width:8;opacity:.15}
.tc-art .refl{stroke-width:1.6;opacity:.15}
.tc-art .water{fill:none;stroke:rgba(236,239,244,.22);stroke-width:1.2}
.tc-art .pen{fill:#fff;opacity:0}
.tc-art .pen-g{fill:var(--c);opacity:0}
.tc-art .tc-trail{fill:var(--c);opacity:0;pointer-events:none}
.tc-art .tc-burst{fill:none;stroke:var(--c);stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.tc-art .tc-burst.go{animation:burstPing .75s cubic-bezier(.2,.7,.3,1)}
@keyframes burstPing{0%{opacity:.85;transform:scale(.25)}70%{opacity:.22}100%{opacity:0;transform:scale(2.8)}}
.wob{animation:wob 3.4s ease-in-out infinite alternate}
@keyframes wob{to{transform:translate(6px,2px)}}
.tticks{position:absolute;left:50%;bottom:calc(var(--bb) + 18px);z-index:2;display:flex;gap:2px;transform:translateX(-50%);transition:opacity .3s}
.trailer:not(.is-playing) .tticks{opacity:0;pointer-events:none}
.tticks button{position:relative;width:30px;height:22px;padding:0;border:0;background:none;cursor:pointer}
.tticks button::after{content:"";position:absolute;left:4px;right:4px;top:10px;height:2px;background:rgba(236,239,244,.2);transition:background .3s}
.tticks button.on::after{background:var(--sodium);box-shadow:0 0 8px var(--sodium)}
.tticks button:hover::after{background:var(--ink)}
.trailer-hint{position:absolute;z-index:3;left:50%;bottom:calc(var(--bb) + 52px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);transition:opacity .6s;pointer-events:none}
.trailer-hint span{width:26px;height:1px;background:var(--ice);animation:hintx 1.8s var(--ease) infinite}
.trailer.used .trailer-hint{opacity:0}
.trailer:not(.is-playing) .trailer-hint{opacity:0}
.trailer-stage{cursor:none}
.trailer-stage.dragging{cursor:none;user-select:none}
.t-cursor{position:fixed;top:0;left:0;z-index:60;width:0;height:0;opacity:0;pointer-events:none;mix-blend-mode:difference;transition:opacity .3s}
.t-cursor.on{opacity:1}
.t-cursor .tc-ring{position:absolute;top:-20px;left:-20px;width:40px;height:40px;border:1px solid var(--tcc,#fff);border-radius:50%;transition:width .25s,height .25s,top .25s,left .25s,border-color .4s}
.t-cursor .tc-dot{position:absolute;top:-3px;left:-3px;width:6px;height:6px;border-radius:50%;background:var(--tcc,#fff);transition:background-color .4s}
.t-cursor.drag .tc-ring{top:-28px;left:-28px;width:56px;height:56px}
@media (max-width:759px),(pointer:coarse){.t-cursor{display:none}.trailer-stage{cursor:grab}.trailer-stage.dragging{cursor:grabbing}}
@media (max-width:759px){.tc-art .line{stroke-width:2.4}.tc-art .glow{stroke-width:8}.tc-art .refl{stroke-width:2}.tc-copy{max-width:min(320px,74vw);max-height:30vh}.tc-t{font-size:clamp(14px,3.6vw,18px)}.tticks button{width:24px}.tc-geo{font-size:10px}.trailer-hint{display:none}}
html:not(.fx) .trailer{height:auto}
html:not(.fx) .trailer-stage{position:relative;height:auto;perspective:none;cursor:auto}
html:not(.fx) .t-cursor{display:none}
html:not(.fx) .trailer-tilt,html:not(.fx) .tilt-near{position:relative;inset:auto;transform:none}
html:not(.fx) .tcards{position:relative;display:block;width:auto}
html:not(.fx) .tcard{width:auto;height:auto;padding:10vh 0 4vh}
html:not(.fx) .tc-copy,html:not(.fx) .tc-art{position:relative;top:auto;bottom:auto}
html:not(.fx) .tc-copy{max-height:none;overflow:visible;margin-bottom:24px}
html:not(.fx) .tc-art{display:block;height:auto;aspect-ratio:10/7;max-height:70vh}
html:not(.fx) .tticks,html:not(.fx) .city-far,html:not(.fx) .trailer-hint,html:not(.fx) .tc-trail,html:not(.fx) .tc-burst,html:not(.fx) .trailer-glow,html:not(.fx) .tilt-far{display:none}
html:not(.fx) .tc-geo{clip-path:none}

/* ---------- scenes ---------- */
.scene{position:relative;padding:clamp(60px,8vh,100px) var(--gutter)}
.wrap{max-width:1240px;margin:0 auto}
.scene-head{max-width:780px;margin-bottom:clamp(52px,7vw,96px)}
.slate{display:flex;align-items:center;gap:14px;margin:0 0 24px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.slate::before{content:"";flex:none;width:22px;height:11px;background:repeating-linear-gradient(-55deg,var(--ink) 0 3px,transparent 3px 6px);opacity:.7}
.slate b{font-weight:500;color:var(--sodium);letter-spacing:.06em}
.h2{margin:0;font-size:clamp(40px,5.6vw,84px);font-weight:500;line-height:.98;letter-spacing:-.045em}
.h2 em,.h2 .thin{font-style:normal;font-weight:200}
.lede{margin-top:26px;max-width:54ch;font-size:clamp(17px,1.35vw,20px);line-height:1.55;color:var(--ink-2)}
.h3{margin:0 0 12px;font-size:clamp(22px,2vw,28px);font-weight:500;line-height:1.12;letter-spacing:-.03em}
.h3 em{font-style:normal;font-weight:200}
.body{font-size:16px;line-height:1.62;color:var(--ink-2);max-width:54ch}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0;padding:0}
.tags li{font-family:var(--mono);font-size:11.5px;line-height:1.2;color:var(--ink-2);padding:6px 9px;border:1px solid var(--hair)}
.center{text-align:center;margin-left:auto;margin-right:auto}
.center .slate{justify-content:center}
.center .lede{margin-left:auto;margin-right:auto}
.brackets::after{content:"";position:absolute;inset:-1px;pointer-events:none;--c:rgba(236,239,244,.5);background:linear-gradient(var(--c),var(--c)) 0 0/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1px 16px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1px 16px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1px 16px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/16px 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1px 16px no-repeat}

/* focus pull: each scene's title racks into focus once */
html.fx [data-focus]{transition:filter 1.4s var(--ease),opacity 1.4s var(--ease)}
html.fx [data-focus]:not(.in){filter:blur(9px);opacity:.25}

/* process — storyboard */
.board{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.4vw,36px)}
.pframe{position:relative;aspect-ratio:16/10;border:1px solid var(--hair-2);background:radial-gradient(120% 90% at 50% 0%,rgba(140,203,255,.06),transparent 62%),#03050A;overflow:hidden}
.pframe::before{content:"";position:absolute;inset:9% 7%;border:1px dashed rgba(236,239,244,.08)}
.pframe svg{position:absolute;inset:0;width:100%;height:100%}
.pframe .s{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.85;vector-effect:non-scaling-stroke}
.pframe .s.a{stroke:var(--sodium);opacity:1}
.pframe .s.b{stroke:var(--ice);opacity:.75}
.pframe .s.f{opacity:.18}
html.fx .panel .s{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s var(--ease) calc(var(--d,0) * 1s)}
html.fx .panel.in .s{stroke-dashoffset:0}
.fnum{position:absolute;right:12px;bottom:9px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.fnum.big{left:14px;right:auto;top:10px;bottom:auto;font-size:12px;color:var(--ink-2)}
.plabel{margin:22px 0 10px;font-family:var(--mono);font-size:12px;color:var(--sodium)}

/* why — console: search pill, hopping dino, value nodes, match readout */
.why-console{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(14px,1.6vw,22px);margin-bottom:clamp(40px,5.4vw,72px)}
.why-flow{position:relative;overflow:hidden;padding:clamp(28px,3.4vw,46px) clamp(18px,2.6vw,34px) clamp(22px,2.8vw,32px);border:0;background:none}
.why-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(140,203,255,.16) 1px,transparent 1.4px);background-size:16px 16px;mask-image:radial-gradient(90% 80% at 50% 20%,#000,transparent 85%);opacity:.8;pointer-events:none}
.why-pill{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;margin:0 auto;padding:11px 22px;width:fit-content;min-width:170px;border-radius:999px;border:1px solid rgba(140,203,255,.35);background:linear-gradient(180deg,rgba(140,203,255,.1),rgba(5,7,12,.5));box-shadow:0 0 0 1px rgba(140,203,255,.05),0 0 24px rgba(140,203,255,.18);font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.why-pill-text{font-style:italic}
.why-pill.searching .why-pill-text{color:var(--ice)}
.why-pill-cursor{width:1.4px;height:14px;background:var(--ice);animation:whyBlink 1s steps(2,jump-none) infinite}
@keyframes whyBlink{50%{opacity:0}}
.why-rail{position:relative;margin:clamp(42px,5.2vw,62px) 2.5% 0;height:1px;background:var(--hair-2)}
.why-rail-dot{position:absolute;top:50%;left:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--sodium);box-shadow:0 0 10px var(--sodium);opacity:0;transform:translate3d(0,0,0)}
.why-dino{position:absolute;left:0;top:0;width:40px;height:34px;color:var(--sodium);filter:drop-shadow(0 0 7px rgba(255,181,71,.55));pointer-events:none;will-change:transform;transition:opacity .3s}
.why-dino-svg{width:100%;height:100%;overflow:visible}
.dino-s{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.dino-eye{fill:currentColor;stroke:none}
.why-dino.hop{animation:whyHop .45s var(--ease)}
@keyframes whyHop{0%{transform:scale(1,1) translateY(0) var(--flip,)}35%{transform:scale(1.12,.8) translateY(2px) var(--flip,)}100%{transform:scale(1,1) translateY(0) var(--flip,)}}
.why-nodes{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.why-node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 14px;border:1px solid var(--hair);background:rgba(236,239,244,.02);color:var(--ink-2);cursor:pointer;transition:border-color .3s,background .3s,color .3s;-webkit-tap-highlight-color:transparent}
.why-node .wn-k{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.why-node .wn-t{font-size:13px;font-weight:500;color:var(--ink)}
.why-node.done{border-color:rgba(140,203,255,.45);background:rgba(140,203,255,.07)}
.why-node.done .wn-k{color:var(--ice)}
.why-node.done .wn-k::after{content:" ✓"}
.why-node.active{border-color:var(--sodium);background:rgba(255,181,71,.08);box-shadow:0 0 18px rgba(255,181,71,.14) inset}
.why-node.active .wn-k,.why-node.active .wn-t{color:var(--sodium)}
.why-hint{display:block;margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:center}
.why-match{position:relative;display:flex;flex-direction:column;padding:clamp(24px,2.8vw,34px);border:1px solid var(--hair);background:linear-gradient(180deg,rgba(236,239,244,.025),rgba(236,239,244,0) 46%)}
.why-match-k{margin:0 0 20px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.why-match-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;font-size:15px;color:var(--ink-2)}
.why-match-pct{font-family:var(--mono);font-size:clamp(30px,3vw,38px);font-weight:500;color:var(--signal);font-variant-numeric:tabular-nums}
.why-match .meters{flex:1}
.why-match-foot{margin:22px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-3)}
@media (max-width:900px){.why-console{grid-template-columns:minmax(0,1fr)}.why-nodes{grid-template-columns:repeat(2,minmax(0,1fr))}}
html:not(.fx) .why-dino{transition:none}
html:not(.fx) .why-dino.hop{animation:none}

/* why — four principles */
.grid4{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--hair)}
.grid4::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(440px circle at var(--mx,50%) var(--my,50%),rgba(140,203,255,.075),transparent 62%);opacity:0;transition:opacity .5s}
.grid4:hover::before{opacity:1}
.cell{position:relative;padding:clamp(30px,3.6vw,54px) 0;border-bottom:1px solid var(--hair)}
.cell:nth-child(odd){padding-right:clamp(24px,4vw,64px);border-right:1px solid var(--hair)}
.cell:nth-child(even){padding-left:clamp(24px,4vw,64px)}
.clabel{margin:0 0 18px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}

/* services — monitors */
.svc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"main a" "main b" "wide wide";gap:clamp(14px,1.6vw,22px)}
.mon{position:relative;padding:clamp(24px,2.6vw,38px);border:1px solid var(--hair);background:linear-gradient(180deg,rgba(236,239,244,.025),rgba(236,239,244,0) 46%)}
.mon-main{grid-area:main;display:flex;flex-direction:column}
.mon-main::before{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;opacity:.12;background:linear-gradient(var(--ink),var(--ink)) 50% 0/1px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) 0 50%/100% 1px no-repeat}
.mon-a{grid-area:a}
.mon-b{grid-area:b}
.mon-wide{grid-area:wide;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:start}
.mon-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(22px,3vw,34px)}
.rec{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--signal)}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal);animation:blink 1.6s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:0}}
.icon{width:38px;height:38px;color:var(--ink);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.mon:not(.mon-main) .icon{margin-bottom:clamp(20px,2.6vw,30px)}
.meters{display:grid;gap:13px;margin:30px 0 6px}
.meter{display:grid;grid-template-columns:118px 40px minmax(0,1fr);align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.mv{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.mbar{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;height:10px}
.mbar i{background:rgba(236,239,244,.1)}
.mbar i.on{background:var(--ice);transition:background .3s calc(var(--i,0) * 40ms)}
html.fx .mon-main:not(.in) .mbar i.on{background:rgba(236,239,244,.1)}
.mon-main .tags{margin-top:auto;padding-top:24px}

/* how it works: folder-tab process cards + signature dithering demo */
.hiw-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;max-width:1080px;margin:0 auto}

.hiw-tab:hover .hiw-grain{opacity:0}

.hiw-num{position:absolute;left:16px;bottom:12px;font-size:clamp(26px,3.4vw,34px);font-weight:600;color:#fff;letter-spacing:-.02em}
.hiw-arrow{position:absolute;right:14px;bottom:12px;color:#fff;font-size:15px;opacity:.75;transition:transform .3s ease}

.hiw-body{padding:20px 20px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.hiw-body h3{font-size:16.5px;font-weight:500;margin:0}
.hiw-body p{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:0}
.hiw-signature{margin-top:clamp(48px,6vw,72px);text-align:center}

.hiw-bm{position:relative;isolation:isolate;padding:28px 26px 26px;border:1px solid var(--hair);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(5,7,11,.5));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .4s ease;cursor:pointer;text-align:left}

.hiw-bm:nth-child(even)::before{background:radial-gradient(closest-side,var(--sodium),transparent 72%)}

.hiw-qz-s1{left:4%;top:3%;width:54%}
.hiw-qz-s2{left:36%;top:29%;width:60%}
.hiw-qz-s3{left:4%;top:64%;width:66%}
.hiw-qz-dots{display:flex;gap:4px;margin-bottom:7px}
.hiw-qz-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25)}
.hiw-qz-k{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--sodium);margin-bottom:4px}
.hiw-qz-step b{display:block;font-size:13.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.hiw-qz-step > small{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3)}
.hiw-qz-opt{position:relative;display:flex;align-items:center;gap:7px;margin-top:6px;font-size:10.5px;color:var(--ink-2);cursor:pointer}
.hiw-qz-opt input{position:absolute;opacity:0;width:16px;height:16px;margin:0;cursor:pointer}
.hiw-qz-dot{position:relative;flex:none;width:13px;height:13px;border-radius:50%;border:1.4px solid rgba(255,255,255,.3);transition:border-color .25s,box-shadow .25s;pointer-events:none}
.hiw-qz-dot::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--sodium);opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
.hiw-qz-opt input:checked + .hiw-qz-dot{border-color:var(--sodium);box-shadow:0 0 10px rgba(255,181,71,.4)}
.hiw-qz-opt input:checked + .hiw-qz-dot::after{opacity:1;transform:scale(1)}
.hiw-qz-opt input:focus-visible + .hiw-qz-dot{outline:2px solid var(--ice);outline-offset:2px}
.hiw-qz-prods{display:flex;align-items:flex-end;gap:6px;margin:8px 0}
.hiw-qz-prods i{width:15px;height:22px;border-radius:4px 4px 7px 7px;background:linear-gradient(160deg,var(--qz-pc),rgba(5,7,11,.9));opacity:.92;transition:background .4s ease}
.hiw-qz-prods i:nth-child(2){height:27px}
.hiw-qz-cta{margin-top:2px;padding:6px 12px;border-radius:999px;border:0;background:var(--sodium);color:#05070B;font-family:var(--mono);font-size:10px;letter-spacing:.04em;cursor:pointer;transition:box-shadow .2s}
.hiw-qz-cta:hover{box-shadow:0 0 18px rgba(255,181,71,.5)}
.hiw-qz-cta.go{animation:hiwQzGo .5s ease}
@keyframes hiwQzGo{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
html:not(.fx) #hiwQzPath{animation:none;stroke-dasharray:none}
html:not(.fx) .hiw-qz-pulse{display:none}
@media (max-width:540px){.hiw-qz-step b{font-size:12.5px}.hiw-qz-k{font-size:8px}.hiw-qz-opt{font-size:9.5px}}

/* AI support pipeline: stacked glass chips cycle on their own, fan out on drag, tap to jump */
.hiw-bm--flow{display:flex;flex-direction:column}
.hiw-fl-wrap{position:relative;margin:16px 0 20px;border-radius:10px;overflow:visible;height:clamp(240px,30vw,290px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.hiw-fl-wrap::before{content:"";position:absolute;inset:0;border-radius:10px;background:radial-gradient(130% 120% at 72% 18%,#0c1626,#05060a 65%);z-index:0}
.hiw-fl-wrap.dragging{cursor:grabbing}
.hiw-fl-chip{position:absolute;left:6%;top:3%;width:64%;padding:12px 14px;border-radius:12px;border:1px solid rgba(140,203,255,.22);background:linear-gradient(160deg,rgba(18,26,40,.95),rgba(6,9,14,.96));box-shadow:0 16px 30px -16px rgba(0,0,0,.6);display:flex;align-items:center;gap:11px;will-change:transform;transform:translate3d(calc(var(--i) * 20px),calc(var(--i) * 46px),0) scale(calc(1 - var(--i) * .025));z-index:calc(4 - var(--i));transition:box-shadow .3s ease;cursor:pointer}
.hiw-fl-chip.active{box-shadow:0 0 0 1px rgba(140,203,255,.5),0 18px 40px -14px rgba(140,203,255,.5)}
.hiw-fl-ico{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(140,203,255,.14);color:var(--ice)}
.hiw-fl-ico svg{width:15px;height:15px}
.hiw-fl-chip b{display:block;font-size:13px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.hiw-fl-chip small{display:block;margin-top:2px;font-size:10.5px;color:var(--ink-3);font-style:italic}
html:not(.fx) .hiw-fl-chip{transition:none}
@media (max-width:540px){.hiw-fl-chip b{font-size:12px}.hiw-fl-chip small{font-size:9.5px}}

/* faq */
.faq-wrap{max-width:980px}
.faq{border-top:1px solid var(--hair)}
.qa{border-bottom:1px solid var(--hair)}
.qa-h{margin:0;font:inherit}
.qa-q{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:28px;padding:26px 0;border:0;background:none;text-align:left;cursor:pointer;font-size:clamp(18px,1.7vw,23px);font-weight:400;line-height:1.35;letter-spacing:-.018em;color:var(--ink)}
.qa-q .ico{position:relative;flex:none;width:16px;height:16px;margin-top:.38em}
.qa-q .ico::before,.qa-q .ico::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;margin-top:-.75px;background:var(--sodium);transition:transform .5s var(--ease)}
.qa-q .ico::after{transform:rotate(90deg)}
.qa.open .qa-q .ico::after{transform:rotate(0deg)}
html.js .qa-a{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .55s var(--ease),visibility 0s linear .55s}

.qa-a > div{overflow:hidden}

/* security */
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:40px;align-items:end}
.radar{position:relative;width:clamp(200px,21vw,290px);aspect-ratio:1;margin-bottom:clamp(52px,7vw,96px);border-radius:50%;overflow:hidden;border:1px solid rgba(140,203,255,.28);background:repeating-radial-gradient(circle closest-side at 50% 50%,transparent 0 calc(25% - 1px),rgba(140,203,255,.15) calc(25% - 1px) 25%),linear-gradient(rgba(140,203,255,.12),rgba(140,203,255,.12)) 50% 0/1px 100% no-repeat,linear-gradient(rgba(140,203,255,.12),rgba(140,203,255,.12)) 0 50%/100% 1px no-repeat}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(140,203,255,0) 0deg,rgba(140,203,255,0) 290deg,rgba(140,203,255,.32) 360deg);animation:sweep 4.8s linear infinite}
@keyframes sweep{to{transform:rotate(1turn)}}
.blip{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--sodium);box-shadow:0 0 10px var(--sodium);opacity:0;animation:blip 4.8s linear infinite}
@keyframes blip{0%{opacity:1}55%{opacity:0}100%{opacity:0}}
.radar.paused .sweep,.radar.paused .blip{animation-play-state:paused}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:clamp(64px,8vw,110px);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stat{padding:28px 24px 30px 0}
.stat + .stat{padding-left:24px;border-left:1px solid var(--hair)}
.sk{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--ice)}
.sv{margin:14px 0 8px;font-size:clamp(50px,5.2vw,80px);font-weight:200;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.sc{font-size:14px;line-height:1.45;color:var(--ink-2)}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:clamp(80px,11vw,150px)}
.actor{padding:0 clamp(16px,1.8vw,28px) 0 0}
.actor + .actor{padding-left:clamp(16px,1.8vw,28px);border-left:1px solid var(--hair)}
.a-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:28px}
.a-name{font-size:clamp(24px,2.3vw,34px);font-weight:500;line-height:1.04;letter-spacing:-.04em}
.a-name small{display:block;margin-top:9px;font-family:var(--mono);font-size:11.5px;font-weight:400;letter-spacing:.02em;color:var(--sodium)}
.a-n{margin-top:6px;font-family:var(--mono);font-size:11px;white-space:nowrap;color:var(--ink-3)}
.actor h3{margin:0 0 10px;font-size:17px;font-weight:500;line-height:1.3;letter-spacing:-.012em}
.actor p{font-size:15px;line-height:1.6;color:var(--ink-2)}
.manifesto{margin:0;max-width:1060px}
.mlabel{margin:0 0 26px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.manifesto blockquote{margin:0}
.manifesto blockquote p{font-size:clamp(30px,4.3vw,64px);font-weight:300;line-height:1.08;letter-spacing:-.04em}
.manifesto blockquote em{font-style:normal;font-weight:600}
.mbody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(34px,4vw,58px);padding-top:28px;border-top:1px solid var(--hair)}
.mbody p{font-size:16.5px;line-height:1.62;color:var(--ink-2)}
.mbody strong{font-weight:500;color:var(--ink)}
.manifesto figcaption{margin-top:30px;font-family:var(--mono);font-size:12px;color:var(--sodium)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,7vw,120px);align-items:start}
.about-l{position:sticky;top:calc(var(--bt) + 56px);margin-bottom:0}
.hl{color:var(--ink)}
.about-r{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.ai{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 20px;padding:30px 0;border-bottom:1px solid var(--hair)}
.ai-n{grid-row:span 2;padding-top:7px;font-family:var(--mono);font-size:12px;color:var(--sodium)}
.ai-t{margin:0 0 10px;font-size:clamp(20px,1.8vw,26px);font-weight:500;letter-spacing:-.025em}

.taglist{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:clamp(52px,6vw,84px)}
.taglist .k{margin-right:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.taglist .t{padding:8px 13px;font-size:14px;border:1px solid var(--hair-2)}

/* contact — terminal */
.scene.contact{padding-top:clamp(232px,30vh,360px)}
.contact{background:radial-gradient(70% 55% at 50% 45%,rgba(125,255,154,.045),transparent 70%)}
/* interactive 3D glowing butterfly, perched above the terminal */
.bfly-stage{position:absolute;left:50%;top:clamp(14px,4.2vh,50px);transform:translateX(-50%);width:min(300px,52vw);height:clamp(150px,19vh,210px);z-index:3;perspective:640px;touch-action:none;cursor:grab}
.bfly-stage.grabbing{cursor:grabbing}
.bfly-tilt{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.bfly-layer{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 54%;will-change:transform}
.bfly-layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bfly-back{filter:blur(3px) drop-shadow(0 10px 18px rgba(0,0,0,.4));opacity:.42}
.bfly-back .bw{fill:var(--ice)}
.bfly-front{filter:drop-shadow(0 18px 28px rgba(0,0,0,.5))}
.bfly-front .fw{stroke:rgba(255,255,255,.5);stroke-width:.6}
.bfly-front .fw-vein{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.8;stroke-linecap:round}
.bfly-body-wrap{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(6px)}
.bfly-body-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bfly-glow{opacity:.5}
.bfly-body{stroke:#dfe6f0;stroke-width:2;stroke-linecap:round}
.bfly-head{fill:#fff}
.bfly-ant{fill:none;stroke:#dfe6f0;stroke-width:1.1;stroke-linecap:round}
.bfly-box{position:absolute;inset:-9% -16%;border:1px dashed rgba(140,203,255,.38);border-radius:6px;pointer-events:none;transition:border-color .3s,opacity .3s}
.bfly-stage.is-active .bfly-box{border-color:rgba(255,181,71,.55)}
.bfly-corner{position:absolute;width:10px;height:10px;border:1.5px solid var(--ice);opacity:.65;pointer-events:none;transition:border-color .3s}
.bfly-stage.is-active .bfly-corner{border-color:var(--sodium)}
.bfly-corner.tl{top:-9%;left:-16%;border-right:none;border-bottom:none}
.bfly-corner.tr{top:-9%;right:-16%;border-left:none;border-bottom:none}
.bfly-corner.bl{bottom:-9%;left:-16%;border-right:none;border-top:none}
.bfly-corner.br{bottom:-9%;right:-16%;border-left:none;border-top:none}
.bfly-tag{position:absolute;left:-16%;bottom:calc(-9% - 18px);font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--ice);opacity:.72;white-space:nowrap}
.bfly-drop{position:absolute;left:50%;top:76%;width:4px;height:4px;border-radius:50%;background:var(--ice);box-shadow:0 0 6px var(--ice);opacity:0;animation:bflyDrip 3.2s linear infinite;animation-delay:calc(var(--i) * .75s)}
@keyframes bflyDrip{0%{transform:translate(-50%,0) scale(1);opacity:0}8%{opacity:.9}65%{opacity:.4}100%{transform:translate(-50%,210px) scale(.35);opacity:0}}
.bfly-landing{position:absolute;left:10%;right:10%;top:0;height:2px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,var(--ice),transparent);opacity:.2;transition:opacity .25s,background .25s}
html:not(.fx) .bfly-drop{display:none}
html:not(.fx) .bfly-tilt{transform:none!important}
html:not(.fx) .bfly-layer{transform:none!important}
@media (max-width:759px){.bfly-stage{width:min(220px,58vw);height:clamp(120px,22vh,160px);top:clamp(10px,3vh,30px)}.scene.contact{padding-top:clamp(190px,32vh,280px)}.bfly-tag{font-size:9px}}
.term{--night:#05070C;--ink:#ECEFF4;--ink-2:rgba(236,239,244,.68);--ink-3:rgba(236,239,244,.56);--ink-inv:#05070B;--sodium:#FFB547;--ice:#8CCBFF;--signal:#7DFF9A;--hair:rgba(236,239,244,.11);--hair-2:rgba(236,239,244,.2);position:relative;max-width:1080px;margin:0 auto;overflow:hidden;border:1px solid var(--hair-2);background:radial-gradient(130% 110% at 50% 0%,#131A22 0%,#0C1117 46%,#0A0E13 100%);box-shadow:0 50px 140px -50px rgba(125,255,154,.22)}
.term::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(236,239,244,.03) 0 1px,transparent 1px 3px)}
.term::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 62%,rgba(0,0,0,.5) 100%)}
.term-bar{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--hair);font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tdots{display:flex;gap:7px}
.tdots i{width:10px;height:10px;border-radius:50%;background:rgba(236,239,244,.16)}
.tready{margin-left:auto;color:var(--signal)}
.tready .blk,.term-h .cur{animation:blink 1.1s steps(2,jump-none) infinite}
.term-body{position:relative;z-index:3;padding:clamp(34px,6vw,84px) clamp(22px,6vw,84px)}
.term-h{margin:0;font-family:var(--mono);font-size:clamp(25px,4.2vw,58px);font-weight:500;line-height:1.14;letter-spacing:-.035em;text-shadow:0 0 26px rgba(125,255,154,.16)}
.term-h .cur{color:var(--signal)}
.tout{display:grid;gap:9px;margin:clamp(28px,4vw,46px) 0;font-family:var(--mono);font-size:clamp(13px,1.2vw,15px)}
.tl{display:flex;gap:14px;color:var(--ink-2)}
.tp{flex:none;width:1ch;color:var(--ink-3)}
.tx{display:inline-block}
.tl.warn .tp{color:var(--sodium)}
.tl.ok,.tl.ok .tp{color:var(--signal)}
html.fx .term .tx{clip-path:inset(0 100% 0 0)}
html.fx .term .tp{opacity:0}
html.fx .term.in .tx{animation:type var(--dur,1s) steps(var(--n,30)) var(--del,0s) forwards}
html.fx .term.in .tp{animation:appear .01s linear var(--del,0s) forwards}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes appear{to{opacity:1}}
.term-p{margin-bottom:28px;font-size:clamp(17px,1.5vw,20px)}

/* credits */
.credits{position:relative;z-index:1;background:transparent;padding:clamp(100px,18vh,200px) var(--gutter) var(--bb);text-align:center}
.c-title{margin:0 -.44em 0 0;font-size:clamp(58px,13vw,210px);font-weight:200;line-height:1;letter-spacing:.44em}
.ftr-bar{position:relative;display:inline-flex;align-items:center;gap:clamp(10px,1.6vw,18px);max-width:min(92vw,600px);width:max-content;margin:28px auto 0;padding:9px 9px 9px clamp(16px,2.2vw,24px);border-radius:999px;text-align:left;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0) 44%),linear-gradient(calc(100deg + var(--hr,0) * 1deg),rgba(255,181,71,.16),rgba(140,203,255,.15) 52%,rgba(125,255,154,.13));border:1px solid var(--hair-2);box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 22px 50px -26px rgba(0,0,0,.65);transition:box-shadow .4s var(--ease),border-color .4s var(--ease)}
.ftr-bar::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .45s var(--ease);background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 68%)}
.ftr-bar.hot::before{opacity:1}
.ftr-bar.hot{border-color:var(--hair);box-shadow:0 1px 0 rgba(255,255,255,.09) inset,0 30px 64px -26px rgba(0,0,0,.7)}
.ftr-bar-chip{position:relative;z-index:1;flex:none;padding:7px 13px;border-radius:999px;background:var(--night);font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--ink);white-space:nowrap}
.ftr-bar-text{position:relative;z-index:1;flex:1;margin:0;min-width:0;font-size:13px;line-height:1.38;color:var(--ink-2)}
.ftr-bar-arrow{position:relative;z-index:1;flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--ink-inv);transition:transform .5s var(--ease),background .35s var(--ease)}
.ftr-bar-arrow svg{width:15px;height:15px}
.ftr-bar:hover .ftr-bar-arrow,.ftr-bar.hot .ftr-bar-arrow{transform:rotate(45deg)}
@media (max-width:560px){.ftr-bar{flex-wrap:wrap;border-radius:26px;padding:16px 16px 14px}.ftr-bar-chip{order:1}.ftr-bar-arrow{order:2;margin-left:auto}.ftr-bar-text{order:3;flex:1 1 100%}}
.c-block{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 22px;max-width:580px;margin:clamp(36px,5.6vw,56px) auto 0;text-align:left}
.c-role{justify-self:end;margin:0;padding-top:3px;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);text-align:right;opacity:.75}
.c-names{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px}
.c-names a{position:relative;display:inline-block;padding-bottom:1px;color:var(--ink-2);transition:color .3s var(--ease),transform .4s var(--ease)}
.c-names a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--sodium);transition:right .45s var(--ease)}
.c-names a:hover{color:var(--ink);transform:translateX(2px)}
.c-names a:hover::after{right:0}
.c-legal{display:flex;flex-wrap:wrap;justify-content:center;gap:7px 22px;margin-top:clamp(14px,2vw,20px);padding:0 var(--gutter);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);opacity:.85}

/* ---------- footer: full-bleed band + neon-smoke step cards + magnetic contact CTA ---------- */
.ftr-band{position:relative;isolation:isolate;width:100vw;left:50%;transform:translateX(-50%);margin:clamp(32px,4.4vw,44px) 0 0;padding:clamp(20px,2.6vw,28px) 0 clamp(18px,2.2vw,24px);background:color-mix(in srgb,var(--ink) 4%,var(--night));border-top:1px solid var(--hair-2)}

.xr{inset:0;z-index:0;-webkit-mask-image:radial-gradient(190px circle at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.55) 45%,transparent 74%);mask-image:radial-gradient(190px circle at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.55) 45%,transparent 74%)}
.xr::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(140,203,255,.4),rgba(140,203,255,.4)) var(--mx,50%) 0/1px 100% no-repeat,linear-gradient(90deg,rgba(140,203,255,.4),rgba(140,203,255,.4)) 0 var(--my,50%)/100% 1px no-repeat}
.mon-main .xr{background:radial-gradient(rgba(140,203,255,.6) 1.1px,transparent 1.6px) 0 0/22px 22px,linear-gradient(rgba(140,203,255,.2) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(140,203,255,.2) 1px,transparent 1px) 0 0/22px 22px}
.mon-a .xr{background:repeating-radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(125,255,154,.34) 0 1px,transparent 1.5px 17px)}
.mon-b .xr{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='48' viewBox='0 0 28 48'><path d='M14 0l14 8v16L14 32 0 24V8zM14 32v16' fill='none' stroke='%23FFB547' stroke-opacity='.4' stroke-width='1'/></svg>") 0 0/28px 48px}
.mon-wide .xr{background:repeating-linear-gradient(45deg,rgba(196,181,253,.28) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(196,181,253,.18) 0 1px,transparent 1px 14px)}
.xr-edge{inset:-1px;z-index:2;padding:1px;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(170,220,255,.95),rgba(140,203,255,0) 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.mon > :not(.xr):not(.xr-edge){position:relative;z-index:1}
.mon-main:hover .mbar i.on{animation:charge 1.1s ease-out both;animation-delay:calc(var(--i,0) * 28ms
